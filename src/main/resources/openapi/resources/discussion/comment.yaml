put:
  operationId: editComment
  tags: [ Discussions ]
  summary: Edit a comment. Only its own author may, and only within a short window of posting it.
  parameters:
    - name: threadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../schemas/CommentRequest.yaml
  responses:
    '200':
      description: The thread, with the comment edited.
      content:
        application/json:
          schema:
            $ref: ../../schemas/Thread.yaml
    '400':
      $ref: ../../responses/BadRequest.yaml
    '401':
      $ref: ../../responses/Unauthorized.yaml
    '404':
      $ref: ../../responses/NotFound.yaml
    '409':
      $ref: ../../responses/Conflict.yaml
