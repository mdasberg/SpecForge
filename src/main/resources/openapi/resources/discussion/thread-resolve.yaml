post:
  operationId: resolveThread
  tags: [ Discussions ]
  summary: Resolve a thread, recording the caller and the current time.
  parameters:
    - name: threadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: The resolved thread.
      content:
        application/json:
          schema:
            $ref: ../../schemas/Thread.yaml
    '401':
      $ref: ../../responses/Unauthorized.yaml
    '404':
      $ref: ../../responses/NotFound.yaml
    '409':
      $ref: ../../responses/Conflict.yaml
