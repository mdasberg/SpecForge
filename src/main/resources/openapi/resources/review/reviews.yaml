get:
  operationId: listReviews
  tags: [ Review ]
  summary: The reviews, most recently updated first.
  parameters:
    - name: state
      in: query
      required: false
      description: Restrict to open or to closed reviews. Omitted returns both.
      schema:
        $ref: ../../schemas/ReviewState.yaml
    - name: specId
      in: query
      required: false
      description: Only reviews of this specification.
      schema:
        type: string
        format: uuid
    - $ref: ../../parameters/LimitParam.yaml
    - $ref: ../../parameters/CursorParam.yaml
  responses:
    '200':
      description: The matching reviews.
      content:
        application/json:
          schema:
            $ref: ../../schemas/ReviewList.yaml
    '400':
      $ref: ../../responses/BadRequest.yaml
    '401':
      $ref: ../../responses/Unauthorized.yaml
post:
  operationId: openReview
  tags: [ Review ]
  summary: Open a review of one specification between two of its versions.
  description: >
    The manual counterpart to pull-request synchronisation, for a specification whose change did not
    arrive through a pull request. The specification moves to In Review, and a specification that
    already has an open review is a conflict rather than a second review — reviewers approve a
    specification, and two open reviews of it could not both be the answer.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../schemas/ReviewRequest.yaml
  responses:
    '201':
      description: The review was opened.
      content:
        application/json:
          schema:
            $ref: ../../schemas/Review.yaml
    '400':
      $ref: ../../responses/BadRequest.yaml
    '401':
      $ref: ../../responses/Unauthorized.yaml
    '404':
      $ref: ../../responses/NotFound.yaml
    '409':
      $ref: ../../responses/Conflict.yaml
    '422':
      $ref: ../../responses/UnprocessableEntity.yaml
