name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # A stuck container wait once ran for sixteen minutes before failing; without this a genuine
    # hang would hold a runner for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      # `build` runs the unit suite, the Spring Modulith boundary verification and integrationTest.
      # The docker-compose plugin brings compose.yml up itself, so this also proves the realm export
      # is importable: Keycloak has to reach its healthcheck before any test runs.
      - run: ./gradlew build

      - if: failure()
        run: docker compose logs --no-color --tail=200

      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: build/test-results/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # `build` is `tsc -b && vite build`, so this is the typecheck and the bundle in one step.
      - run: npm run build
