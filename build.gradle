plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.avast.gradle.docker-compose' version '0.17.9'
    id 'org.openapi.generator' version '7.16.0'
}

group = 'com.specforge'
version = '0.0.1-SNAPSHOT'
description = 'SpecForge — collaborative review and approval for software specifications'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// The OpenAPI contract is the source of truth for the HTTP API: these tasks generate the server
// interfaces and the request and response types from it, and a controller implements a generated
// interface, so an endpoint that drifts from the contract fails to compile. Never edit the
// generated Java — edit the contract.
def apiContract = "$projectDir/src/main/resources/openapi/specforge-api.yaml"

openApiGenerate {
    generatorName = 'spring'
    library = 'spring-cloud'
    inputSpec = apiContract
    configFile = "$projectDir/openapi-generator-config.yaml"
    outputDir = layout.buildDirectory.dir('generated/openapi').get().asFile.toString()
    apiPackage = 'com.specforge.platform.api.generated'
    modelPackage = 'com.specforge.platform.api.dto'
    modelNameSuffix = ''
}

// The same contract bundled to a single JSON file, which is what /api/openapi.json serves. Serving
// the generated bundle rather than a hand-kept copy is what keeps the published document and the
// interfaces provably the same artefact.
def bundleApiContract = tasks.register('bundleApiContract', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = 'openapi'
    inputSpec = apiContract
    outputDir = layout.buildDirectory.dir('generated/openapi-doc').get().asFile.toString()
    logToStderr = true
}

sourceSets {
    main {
        java {
            srcDir layout.buildDirectory.dir('generated/openapi/src/main/java')
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.openApiGenerate
}

processResources {
    dependsOn bundleApiContract
    from(layout.buildDirectory.dir('generated/openapi-doc')) {
        include 'openapi.json'
        into 'openapi'
    }
}

// Integration tests live in their own source set at src/itest, the same layout as the CarePay
// services. The source set is the filter, so its classes are named *Test like any other test and
// need no *IT suffix. Utilities and fixtures from src/test are on its classpath.
sourceSets {
    itest {
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    itestImplementation.extendsFrom testImplementation
    itestCompileOnly.extendsFrom testCompileOnly
    itestRuntimeOnly.extendsFrom testRuntimeOnly
}

idea {
    module {
        // Without this IntelliJ marks src/itest as production source.
        testSources.from(sourceSets.itest.java.srcDirs)
        testResources.from(sourceSets.itest.resources.srcDirs)
    }
}

ext {
    springModulithVersion = '2.1.1'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'

    runtimeOnly 'org.postgresql:postgresql'
    // Spring Boot 4 split auto-configuration into per-technology modules: liquibase-core alone
    // leaves LiquibaseAutoConfiguration off the classpath and the migrations silently never run.
    runtimeOnly 'org.springframework.boot:spring-boot-liquibase'
    runtimeOnly 'org.liquibase:liquibase-core'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'org.springframework.modulith:spring-modulith-docs'
    // No test-only JDBC or Liquibase dependencies: testRuntimeOnly extends runtimeOnly, so the
    // tests already run against exactly the driver and migration engine the application ships.
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// The module graph is generated by Documenter in ModuleDocumentationTests, never drawn by hand.
// Output lands in build/spring-modulith-docs (PlantUML component diagrams + module canvases).
tasks.register('moduleDocs', Test) {
    description = 'Generates the Spring Modulith module documentation.'
    group = 'documentation'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'com.specforge.ModuleDocumentationTests'
    }
    outputs.dir(layout.buildDirectory.dir('spring-modulith-docs'))
}

def integrationTest = tasks.register('integrationTest', Test) {
    description = 'Runs the src/itest suite against the docker compose environment.'
    group = 'verification'
    testClassesDirs = sourceSets.itest.output.classesDirs
    classpath = sourceSets.itest.runtimeClasspath
    shouldRunAfter test
    // The result depends on PostgreSQL and Keycloak, not only on this source tree, so Gradle's
    // up-to-date check would otherwise skip the run and report a pass it never made.
    outputs.upToDateWhen { false }
}

check.dependsOn integrationTest

// One environment definition (compose.yml) shared by the developer, integrationTest and CI, the
// same way the CarePay java-docker-compose-conventions plugin wires it. Unit tests need no Docker,
// so only integrationTest brings the stack up.
dockerCompose {
    useComposeFiles = ['compose.yml']
    // Images are pulled, never built here.
    composeBuild.enabled = false
    upAdditionalArgs = ['--quiet-pull']
    // Fail fast if a container never turns healthy; the plugin default is 15 minutes.
    waitForHealthyStateTimeout = java.time.Duration.ofMinutes(5)
    // No project name, so the stack is byte-for-byte the one `docker compose up` in this directory
    // creates. A generated name would collide with the developer's stack over container_name.
    projectName = null
    // Containers are left running afterwards, as the convention plugin does: the developer keeps
    // the environment they already had, and a CI runner discards it with the job.
    isRequiredBy(integrationTest.get())
    captureContainersOutput(true)
}
